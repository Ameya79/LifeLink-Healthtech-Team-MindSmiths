services:
  lifelink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifelink_healthtech_portal
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-lifelink_production_secret_key_change_me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-2.0-flash-lite}
    volumes:
      - lifelink_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  lifelink_data:
    driver: local
